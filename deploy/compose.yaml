# PROPOSAL ONLY — do not apply to a running gateway.
# Merge through the operator's existing Portainer-managed stack.
# The same dedicated bridge must contain exactly CPA and xiaomi-quota.
services:
  xiaomi-quota:
    image: cpa-xiaomi-tokenplan-quota:0.3.0
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    environment:
      ACCOUNT_LABEL: ${ACCOUNT_LABEL:?Set an operator-approved non-secret account label}
      ACCOUNT_REGION: sgp
      ACCOUNT_BINDING_CONFIRMED: ${ACCOUNT_BINDING_CONFIRMED:?Confirm account binding first}
      # renewal-status.json beside it is read as RENEWAL_STATUS_FILE's default.
      MIMO_COOKIE_FILE: /run/secrets/xiaomi-quota/mimo_session
    volumes:
      # Mount the owner-only session DIRECTORY, not the file: the refresher replaces
      # files atomically (temp + rename = new inode), which a single-file bind mount
      # would hide until a container restart. The collector resumes on its own.
      - type: bind
        source: ${MIMO_SESSION_DIR:?Set a protected absolute owner-only session-directory path}
        target: /run/secrets/xiaomi-quota
        read_only: true
    expose: ["8787"] # Not a host publication; never add ports.
    networks: [xiaomi-quota]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:8787/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  xiaomi-quota:
    external: true # Separately approved dedicated bridge, CPA + collector ONLY.
    name: cpa-xiaomi-quota
